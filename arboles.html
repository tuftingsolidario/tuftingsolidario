<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bosque Virtual | EcoLegado Alfombras</title>
    <!-- Carga de reCAPTCHA Enterprise para App Check -->
    <script src="https://www.google.com/recaptcha/enterprise.js?render=6LfWWOMtAAAAAG-5zjE4hywzDE1Qtfbz1AuRd30g"></script>
    <style>
        :root { --primary: #2c5e3b; --secondary: #4CAF50; --bg: #f4f9f4; --text: #333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; text-align: center; }
        header { background: var(--primary); color: white; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        header h1 { margin: 0 0 10px; font-size: 2rem; }
        .buscador { margin: 40px 0; display: flex; justify-content: center; gap: 10px; }
        input { padding: 12px; width: 60%; max-width: 320px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--secondary); box-shadow: 0 0 5px rgba(76, 175, 80, 0.3); }
        button { padding: 12px 24px; background-color: var(--secondary); color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #388E3C; }
        .tarjeta-arbol { background: white; padding: 25px; border-radius: 12px; max-width: 500px; margin: 0 auto; box-shadow: 0 6px 15px rgba(0,0,0,0.08); text-align: left; }
        .tarjeta-arbol h2 { color: var(--primary); margin-top: 0; text-align: center; }
        .tarjeta-arbol p { margin: 8px 0; font-size: 1.05rem; }
        
        /* Contenedor de la galería de crecimiento */
        .galeria-crecimiento { display: flex; gap: 10px; overflow-x: auto; margin-top: 15px; padding-bottom: 5px; }
        .galeria-crecimiento img { width: 100%; max-width: 210px; height: 180px; object-fit: cover; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); border: 2px solid #e0e0e0; flex-shrink: 0; }
        
        .mensaje-estado { font-weight: bold; color: #666; margin-top: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>El Bosque de los Legados</h1>
        <p>Tu hogar, tu huella, tu legado. Cada alfombra siembra vida eterna.</p>
    </header>

    <main>
        <section class="buscador">
            <input type="text" id="searchInput" placeholder="Ingresa tu código (ej. ECO-002)" onkeypress="if(event.key === 'Enter') buscarArbol()">
            <button onclick="buscarArbol()">Buscar 🌳</button>
        </section>

        <section id="resultadoArbol" class="tarjeta-arbol" style="display: none;">
            <!-- Contenido dinámico -->
        </section>
        <div id="estadoBusqueda" class="mensaje-estado">Ingresa tu código único para conocer la evolución y crecimiento de tu árbol protector.</div>
    </main>

    <!-- Script de Firebase y lógica para galería de crecimiento -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDt8rNOONVBbJUIXT0MYHAHm6bbV9sZ1mk",
            authDomain: "ecolegado-21e65.firebaseapp.com",
            databaseURL: "https://ecolegado-21e65-default-rtdb.firebaseio.com",
            projectId: "ecolegado-21e65",
            storageBucket: "ecolegado-21e65.firebasestorage.app",
            messagingSenderId: "678783567354",
            appId: "1:678783567354:web:657139d7917401b745d043",
            measurementId: "G-MJ78QZDTHJ"
            };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        try {
            initializeAppCheck(app, {
                provider: new ReCaptchaEnterpriseProvider('6LfWWOMtAAAAAG-5zjE4hywzDE1Qtfbz1AuRd30g'),
                isTokenAutoRefreshEnabled: true
            });
        } catch (e) {
            console.error("Error al inicializar App Check:", e);
        }

        window.buscarArbol = async function() {
            const codigoBuscado = document.getElementById('searchInput').value.trim();
            const contenedor = document.getElementById('resultadoArbol');
            const estado = document.getElementById('estadoBusqueda');
            
            if (!codigoBuscado) {
                estado.innerHTML = "<span style='color: #d9534f;'>Por favor, escribe un código válido.</span>";
                contenedor.style.display = "none";
                return;
            }

            estado.textContent = "Buscando la evolución en el bosque virtual...";
            contenedor.style.display = "none";

            try {
                const q = query(collection(db, "arboles"), where("codigo", "==", codigoBuscado));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    estado.innerHTML = "<span style='color: #d9534f;'>No encontramos ningún árbol con ese código. ¡Verifica e intenta nuevamente!</span>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // Generar dinámicamente las etiquetas de imagen según el array guardado en Firestore
                    let imagenesHTML = '';
                    if (data.imagenes && Array.isArray(data.imagenes)) {
                        data.imagenes.forEach((urlImg, index) => {
                            imagenesHTML += `<img src="${urlImg}" alt="Crecimiento ${index + 1} de ${data.protector}">`;
                        });
                    }

                    contenedor.innerHTML = `
                        <h2>🌿 ${data.especie}</h2>
                        <p><strong>Protector/a:</strong> ${data.protector}</p>
                        <p><strong>Código Único:</strong> ${data.codigo}</p>
                        <p><strong>Evolución del Crecimiento:</strong></p>
                        <div class="galeria-crecimiento">
                            ${imagenesHTML}
                        </div>
                    `;
                    contenedor.style.display = "block";
                    estado.textContent = "";
                });
            } catch (error) {
                console.error("Error en la consulta:", error);
                estado.innerHTML = "<span style='color: #d9534f;'>Ocurrió un error al consultar la base de datos de manera segura.</span>";
            }
        }
    </script>

</body>
</html>
